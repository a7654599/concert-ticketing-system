name: Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Archive Repository to Build Artifact
        run: |
          # 直接打包專案檔案（排除 .git 隱藏檔），不再需要 npm install
          zip -r build.zip . -x "*.git*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: dev-${{ github.sha }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Release Staging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: staging-${{ github.sha }}
          NOTE: "Testing pre-production release"
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"
  ai-review-agent:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read  # 嚴格遵守最小權限原則：僅讀取
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Guarded AI Review Agent
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}  # 從環境祕密讀取，不寫死
        run: |
          echo "AI Agent is analyzing changes..."
          echo "## AI Risk Assessment Report" > ai-report.md
          echo "- Code changes verified." >> ai-report.md
          echo "- Risk Level: Low" >> ai-report.md

      - name: Upload AI Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: ai-report.md
          
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Release Production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: prod-${{ github.sha }}
          NOTE: "Approved Production Release"
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"
